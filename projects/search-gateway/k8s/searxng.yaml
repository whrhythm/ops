apiVersion: v1
kind: Namespace
metadata:
  name: search-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings-v5
  namespace: search-system
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only: [360search, mwmbl, bing, yandex]
    engines:
      - {name: 360search, disabled: false}
      - {name: mwmbl, disabled: false}
      - {name: bing, disabled: false, base_url: 'https://cn.bing.com'}
      - {name: yandex, disabled: false, timeout: 2.8, weight: 0.7}
    server:
      limiter: false
      public_instance: false
      image_proxy: false
    search:
      formats: [html, json]
      default_lang: all
      safe_search: 1
    outgoing:
      request_timeout: 3.0
      max_request_timeout: 4.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: search-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: searxng}
  template:
    metadata:
      labels: {app.kubernetes.io/name: searxng}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: searxng
          image: harbor.k3s.local/internal/starbridge-searxng@sha256:a2325ad4b9f8648ef597c22d1df6d7faa0422d998d95bddd4be35c8e203a300f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 80m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          env:
            - {name: SEARXNG_SETTINGS_PATH, value: /run/search/settings.yml}
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef: {name: searxng-session, key: secret}
          volumeMounts:
            - {name: settings, mountPath: /run/search, readOnly: true}
      volumes:
        - name: settings
          configMap: {name: searxng-settings-v5}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: search-system
spec:
  selector: {app.kubernetes.io/name: searxng}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng
  namespace: search-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: searxng}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: search-gateway}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/3]
      ports: [{port: 443, protocol: TCP}]
