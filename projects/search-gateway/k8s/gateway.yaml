apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-gateway
  namespace: search-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: search-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: search-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: SEARCH_GATEWAY_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: search-gateway
  namespace: search-system
spec:
  selector: {app.kubernetes.io/name: search-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-gateway
  namespace: search-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: search-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: search-gateway}}
        - namespaceSelector: {matchLabels: {app.kubernetes.io/managed-by: platform-control}}
          podSelector: {matchLabels: {codechat.io/project-tool: "true"}}
      ports: [{port: 8080, protocol: TCP}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: searxng}}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
