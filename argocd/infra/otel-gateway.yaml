apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: otel-gateway
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.178.0
    helm:
      values: |
        mode: deployment
        fullnameOverride: otel-gateway
        replicaCount: 1
        image:
          repository: otel/opentelemetry-collector-contrib
          tag: "0.163.2"
        command:
          name: otelcol-contrib
        extraEnvs:
          - name: METER_RECEIVER_TOKEN
            valueFrom:
              secretKeyRef:
                name: otel-model-usage
                key: token
        alternateConfig:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: ${env:MY_POD_IP}:4317
                http:
                  endpoint: ${env:MY_POD_IP}:4318
            otlp/model-usage:
              protocols:
                http:
                  endpoint: ${env:MY_POD_IP}:4328
                  auth:
                    authenticator: bearertokenauth/model-usage
          processors:
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            filter/noise:
              error_mode: ignore
              logs:
                log_record:
                  - 'IsMatch(body, "(?i)\"(GET|HEAD|POST) /(livez|readyz|healthz)([?\" ]|$)")'
            batch:
              send_batch_size: 1024
              timeout: 10s
          exporters:
            otlp:
              endpoint: signoz-otel-collector.signoz.svc.cluster.local:4317
              tls:
                insecure: true
            otlp_http/model-usage:
              logs_endpoint: http://metering-receiver.platform-system.svc.cluster.local:8095/v1/logs
              encoding: json
              compression: none
              headers:
                X-Meter-Token: ${env:METER_RECEIVER_TOKEN}
              sending_queue:
                enabled: false
              retry_on_failure:
                enabled: false
          extensions:
            health_check:
              endpoint: ${env:MY_POD_IP}:13133
            bearertokenauth/model-usage:
              token: ${env:METER_RECEIVER_TOKEN}
          service:
            extensions:
              - health_check
              - bearertokenauth/model-usage
            pipelines:
              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlp
              metrics:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlp
              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - filter/noise
                  - batch
                exporters:
                  - otlp
              logs/model-usage:
                receivers:
                  - otlp/model-usage
                exporters:
                  - otlp_http/model-usage
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
            appProtocol: grpc
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
          model-usage:
            enabled: true
            containerPort: 4328
            servicePort: 4328
            protocol: TCP
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
