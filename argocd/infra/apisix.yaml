apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: apisix
spec:
  project: default
  source:
    repoURL: https://github.com/apache/apisix-helm-chart
    path: charts/apisix
    targetRevision: apisix-ingress-controller-1.4.1
    helm:
      values: |
        # Public HTTPS entry point reachable through the node's LAN/Tailscale IP.
        # Preserve the existing HTTP NodePort when adding the TLS listener.
        service:
          http:
            nodePort: 30097
          tls:
            nodePort: 30443
        apisix:
          admin:
            allow:
              ipList:
                - 127.0.0.0/8
                - 172.16.0.0/16
          ssl:
            enabled: true
          pluginAttrs:
            redirect:
              https_port: 30443
        etcd:
          # Built-in etcd is for dev/test only; single node runs one replica.
          replicaCount: 1
          # This hook (meant for helm upgrades) deadlocks fresh ArgoCD
          # installs: the Job mounts the release's JWT secret, which only
          # exists after the release resources are applied.
          preUpgradeJob:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: apisix
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
