# kubernetes-sigs/agent-sandbox CRDs, vendored from release v1.0.9
# (sandbox-with-extensions.yaml), one file per CRD. Each CRD carries
# `argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false`:
# `sandboxes` (~199KiB) and `sandboxtemplates` (~205KiB) are close to the
# 256KiB last-applied-configuration annotation limit of client-side apply, and
# Delete=false keeps data CRs safe if this Application is removed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-sandbox-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: agent-sandbox-crds
spec:
  project: default
  source:
    repoURL: https://github.com/whrhythm/ops.git
    targetRevision: main
    path: apps/agent-sandbox/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
