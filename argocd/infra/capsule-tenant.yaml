apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capsule-tenant
  namespace: argocd
  annotations:
    # After capsule: the Tenant CRD must exist first.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: capsule
spec:
  project: default
  source:
    repoURL: https://github.com/whrhythm/ops.git
    targetRevision: main
    path: apps/capsule
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
