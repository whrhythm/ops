apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    # After the metallb chart: the IPAddressPool/L2Advertisement CRDs must
    # exist first.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: metallb
spec:
  project: default
  source:
    repoURL: https://github.com/whrhythm/ops.git
    targetRevision: main
    path: apps/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
