apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: otel-agent
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.178.0
    helm:
      values: |
        mode: daemonset
        fullnameOverride: otel
        image:
          repository: otel/opentelemetry-collector-contrib
          tag: "0.163.2"
        command:
          name: otelcol-contrib
        presets:
          hostMetrics:
            enabled: true
        extraEnvs:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: host.name=$(NODE_NAME)
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        extraVolumes:
          - name: varlogpods
            hostPath:
              path: /var/log/pods
        extraVolumeMounts:
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
        clusterRole:
          create: true
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch"]
        alternateConfig:
          receivers:
            filelog:
              include:
                - /var/log/pods/*/*/*.log
              exclude:
                - /var/log/pods/otel_otel-agent-*/opentelemetry-collector/*.log
                - /var/log/pods/otel_otel-gateway-*/opentelemetry-collector/*.log
              start_at: end
              include_file_path: true
              include_file_name: false
              operators:
                - type: container
                  id: container-parser
                  max_log_size: 102400
          processors:
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            resourcedetection:
              detectors:
                - env
              timeout: 5s
            k8sattributes:
              auth_type: serviceAccount
              passthrough: false
              pod_association:
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.uid
              extract:
                metadata:
                  - k8s.deployment.name
                labels:
                  - tag_name: app_name
                    key: app.kubernetes.io/name
                    from: pod
            transform/service_name:
              error_mode: ignore
              log_statements:
                - context: log
                  statements:
                    - set(resource.attributes["service.name"], resource.attributes["k8s.pod.name"])
                      where resource.attributes["k8s.pod.name"] != nil
                    - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"])
                      where resource.attributes["k8s.deployment.name"] != nil
                    - set(resource.attributes["service.name"], resource.attributes["app_name"])
                      where resource.attributes["app_name"] != nil
            batch:
              send_batch_size: 1024
              timeout: 10s
          exporters:
            otlp:
              endpoint: signoz-otel-collector.signoz.svc.cluster.local:4317
              tls:
                insecure: true
            otlp/gateway:
              endpoint: otel-gateway.otel.svc.cluster.local:4317
              tls:
                insecure: true
          extensions:
            health_check:
              endpoint: ${env:MY_POD_IP}:13133
          service:
            extensions:
              - health_check
            pipelines:
              metrics:
                receivers: []
                processors:
                  - memory_limiter
                  - resourcedetection
                  - batch
                exporters:
                  - otlp
              logs:
                receivers:
                  - filelog
                processors:
                  - memory_limiter
                  - resourcedetection
                  - k8sattributes
                  - transform/service_name
                  - batch
                exporters:
                  - otlp/gateway
        service:
          enabled: false
        ports:
          otlp:
            enabled: false
          otlp-http:
            enabled: false
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: otel
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
