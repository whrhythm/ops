apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: 2.0.0
      helm:
        valueFiles: [$values/apps/langfuse/helm-values.yaml]
    - repoURL: https://github.com/whrhythm/ops.git
      targetRevision: main
      ref: values
      path: apps/langfuse/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
