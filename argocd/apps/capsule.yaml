apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capsule
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: capsule
spec:
  project: default
  source:
    # Vendored chart (like kubepilot): ArgoCD 2.12's repo-server bundles
    # helm 3.15.2, whose `helm pull --repo oci://` is broken (routes OCI
    # repos through the HTTP index path -> "object required"), so the
    # OCI source is unusable. apps/capsule/chart/ is the published
    # oci://ghcr.io/projectcapsule/charts/capsule:0.15.2 package
    # (includes the capsule-proxy subchart). To upgrade, re-extract the
    # new published chart here.
    repoURL: https://github.com/whrhythm/ops.git
    targetRevision: main
    path: apps/capsule/chart
    helm:
      # skipCrds: do NOT take the chart's crds/ dir into the manifest list.
      # Those raw CRDs lack the .patch overlays (conversion webhook +
      # cert-manager.io/inject-ca-from) that the template path applies, so
      # they would be permanently OutOfSync against the live CRDs.
      skipCrds: true
      # crds.inline: render the CRDs (patch overlays included) as ordinary
      # wave-0 resources instead of the default crd-lifecycle hook, which
      # wraps every CRD in a ConfigMap (tenants ~427KB, rulestatuses
      # ~716KB) that blows the 256KiB last-applied-configuration annotation
      # limit of client-side apply. The per-resource sync-options annotation
      # below forces server-side apply for all CRDs regardless.
      values: |
        crds:
          inline: true
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        # Pin the CRD-defaulted impersonation fields explicitly so the
        # desired manifest matches what the API server materializes in the
        # live CapsuleConfiguration (otherwise perpetual OutOfSync).
        manager:
          options:
            impersonation:
              tenantDefaultServiceAccount: "default"
              skipTlsVerify: false
              caSecretKey: "ca.crt"
    ignoreDifferences:
      # cert-manager injects the webhook CA bundle into the live conversion
      # config of the patched CRDs (live-only field -> would flap OutOfSync).
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers:
          - /spec/conversion/webhook/clientConfig/caBundle
      # The chart template has no hook for spec.events; the API server
      # always materializes the CRD default ({namespace: default}) in the
      # live CapsuleConfiguration, which the manifest cannot express.
      - group: capsule.clastix.io
        kind: CapsuleConfiguration
        jsonPointers:
          - /spec/events
  destination:
    server: https://kubernetes.default.svc
    namespace: capsule-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # NOTE: do NOT add syncOptions: [ServerSideApply=true] here. ArgoCD then
    # enables structured-merge-diff for EVERY resource of the app, and its
    # SMD library (built against k8s 1.31 types) chokes on the k8s 1.36
    # Deployment status field `terminatingReplicas` -> ComparisonError
    # ("field not declared in schema") for all resources. The large CRDs
    # are covered by the per-resource argocd.argoproj.io/sync-options
    # annotation in the chart values above (SSA apply + SMD diff for CRDs
    # only, which are resolved against the cluster's OpenAPI schema).
