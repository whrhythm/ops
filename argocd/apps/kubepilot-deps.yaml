apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubepilot-deps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: kubepilot-deps
spec:
  project: default
  source:
    repoURL: https://github.com/whrhythm/ops.git
    targetRevision: main
    path: apps/kubepilot/deps
  destination:
    server: https://kubernetes.default.svc
    namespace: kubepilot
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
