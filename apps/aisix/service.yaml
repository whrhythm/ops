apiVersion: v1
kind: Service
metadata:
  name: aisix
  namespace: aisix
  labels:
    app.kubernetes.io/name: aisix
spec:
  selector:
    app.kubernetes.io/name: aisix
  ports:
    - name: proxy
      port: 3000
      targetPort: proxy
      protocol: TCP
    - name: admin
      port: 3001
      targetPort: admin
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
