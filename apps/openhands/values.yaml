# OpenHands Agent Canvas is a single-user integration instance, not a tenant platform.
replicaCount: 1
runtimeClassName: kata-qemu-runtime-rs
image:
  # Upstream ghcr.io/openhands/agent-canvas:1.34.0
  repository: ghcr.nju.edu.cn/openhands/agent-canvas
  tag: "1.34.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
serviceAccount:
  create: true
  automountServiceAccountToken: false
rbac:
  enabled: false
ingress:
  enabled: false
persistence:
  enabled: true
  storageClassName: longhorn
  size: 20Gi
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
statefulSet:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
