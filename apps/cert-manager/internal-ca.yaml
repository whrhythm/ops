# Internal CA for in-cluster TLS (Harbor today, other services later).
# A single self-signed CA issued by the existing `selfsigned` ClusterIssuer; the
# CA Certificate lives in the cert-manager namespace because that is where
# ClusterIssuer `ca` issuers look up their signing secret.
#
# Signing chain: selfsigned -> this CA (isCA) -> leaf certs via ClusterIssuer
# `internal-ca`. Nodes trust only the CA (see scripts/harbor-node-registry.sh).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  secretName: internal-ca
  duration: 87600h
  renewBefore: 2160h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-ca
