# Certificate for Authentik (issued by the internal CA in apps/cert-manager).
#
# authentik-tls is mounted under /certs/authentik-web/ for worker discovery;
# the default Brand must select the resulting authentik-web keypair. The SAN
# covers the LAN hostname and the MetalLB IP.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: authentik
spec:
  secretName: authentik-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - authentik.k3s.local
  ipAddresses:
    - 192.168.10.53
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
