apiVersion: v1
kind: Service
metadata:
  name: librechat-mongo
  namespace: librechat
spec:
  selector:
    app: librechat-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: librechat-mongo
  namespace: librechat
spec:
  serviceName: librechat-mongo
  replicas: 1
  selector:
    matchLabels:
      app: librechat-mongo
  template:
    metadata:
      labels:
        app: librechat-mongo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: harbor.k3s.local/internal/librechat-mongo@sha256:4c3c21dadb6373a36c9c4f95fde0cd9bf62afc1baa2fba38a8ca76ecc8b0b0e3
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librechat-secrets
                  key: mongo-password
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
