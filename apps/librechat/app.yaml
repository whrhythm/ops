apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-files
  namespace: librechat
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: librechat
data:
  HOST: 0.0.0.0
  APP_TITLE: 星桥
  PORT: "3080"
  DOMAIN_CLIENT: https://chat.k3s.local:30443
  DOMAIN_SERVER: https://chat.k3s.local:30443
  TRUST_PROXY: "1"
  ALLOW_EMAIL_LOGIN: "false"
  ALLOW_REGISTRATION: "false"
  ALLOW_SOCIAL_LOGIN: "true"
  OPENID_CLIENT_ID: platform-console
  OPENID_ISSUER: https://authentik.k3s.local:30443/application/o/platform/
  OPENID_SCOPE: openid profile email platform-api
  OPENID_USE_PKCE: "true"
  OPENID_CALLBACK_URL: /oauth/openid/callback
  OPENID_BUTTON_LABEL: Authentik
  CODECHAT_PROVISION_URL: https://platform.k3s.local:30443/internal/v1/litellm/key
  CODECHAT_PROVISION_TIMEOUT_MS: "30000"
  STARBRIDGE_FILES_URL: https://platform.k3s.local:30443/internal/v1/workspace
  STARBRIDGE_USAGE_URL: https://platform.k3s.local:30443/internal/v1/codeapi/account-usage
  ENDPOINTS: custom
  LIBRECHAT_CODE_BASEURL: https://platform.k3s.local:30443/internal/v1/codeapi
  CODEAPI_AUTH_PROVIDER: librechat-jwt
  CODEAPI_JWT_ALGORITHM: EdDSA
  CODEAPI_JWT_KID: starbridge-codeapi-20261105
  CODEAPI_JWT_ISSUER: librechat
  CODEAPI_JWT_AUDIENCE: codeapi
  CODEAPI_JWT_TTL_SECONDS: "300"
  CODEAPI_JWT_SINGLE_TENANT_ID: legacy
  NODE_EXTRA_CA_CERTS: /etc/librechat-ca/internal-ca.crt
  SEARCH: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-settings
  namespace: librechat
data:
  librechat.yaml: |
    version: 1.3.18
    interface:
      agents: false
      runCode: true
      memories: false
      multiConvo: false
      prompts: false
      bookmarks: false
    registration:
      socialLogins: ["openid"]
    balance:
      enabled: false
    # LibreChat's encrypted per-user key mechanism is populated by the
    # CodeChat login callback; users cannot supply or replace this key.
    endpoints:
      custom:
        - name: LiteLLM
          apiKey: user_provided
          baseURL: https://platform.k3s.local:30443/agent/v1
          titleConvo: true
          titleModel: deepseek-v4-flash-v2
          titlePrompt: "根据对话生成简短中文标题，只返回标题。\n{convo}"
          modelDisplayLabel: 星桥
          models:
            fetch: false
            default: [deepseek-v4-flash-v2]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: librechat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
      annotations:
        starbridge.local/settings-revision: office-attach-20261113.1
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.110.126
          hostnames: [authentik.k3s.local, platform.k3s.local]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: librechat
          image: harbor.k3s.local/internal/starbridge-office@sha256:1c1306ee042fa12ccbb758cbf6f0caa031fb222cacac60dd5d083693e99e68e8
          command: [node, api/server/index.js]
          ports:
            - containerPort: 3080
          envFrom:
            - configMapRef:
                name: librechat-config
            - secretRef:
                name: librechat-secrets
            - secretRef:
                name: librechat-codechat-provisioning
            - secretRef:
                name: librechat-codeapi
          startupProbe:
            httpGet: {path: /health, port: 3080}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 3080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 3080}
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/librechat-ca
              readOnly: true
            - name: settings
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true
            - name: files
              mountPath: /app/uploads
              subPath: uploads
            - name: files
              mountPath: /app/client/public/images
              subPath: images
      volumes:
        - name: ca
          configMap:
            name: librechat-ca
        - name: settings
          configMap:
            name: librechat-settings
        - name: files
          persistentVolumeClaim:
            claimName: librechat-files
---
apiVersion: v1
kind: Service
metadata:
  name: librechat
  namespace: librechat
spec:
  selector:
    app: librechat
  ports:
    - port: 3080
      targetPort: 3080
