{{- $officeDispatch := .Values.workerSandbox.officeExecutionDispatch }}
{{- if and .Values.workerSandbox.enabled $officeDispatch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeapi.fullname" . }}-office-execution-dispatch
  labels:
    {{- include "codeapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: office-execution-dispatch
spec:
  replicas: {{ $officeDispatch.replicaCount }}
  selector:
    matchLabels:
      {{- include "codeapi.officeDispatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codeapi.officeDispatch.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: office-execution-dispatch
          image: "{{ .Values.workerSandbox.workerImage.repository }}:{{ .Values.workerSandbox.workerImage.tag }}"
          imagePullPolicy: {{ .Values.workerSandbox.workerImage.pullPolicy }}
          command: ["bun", "run", ".build/office-execution-server.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: dispatch
              containerPort: 3114
          env:
            - name: CODEAPI_OFFICE_EXECUTION_BIND
              value: "0.0.0.0"
            - name: CODEAPI_HARDENED_SANDBOX_MODE
              value: "true"
            {{- with .Values.executionProfile }}
            - name: CODEAPI_EXECUTION_PROFILE
              value: {{ . | quote }}
            {{- end }}
            - name: SANDBOX_ENDPOINT
              value: "http://{{ include "codeapi.fullname" . }}-sandbox-runner:{{ .Values.workerSandbox.sandbox.port }}/api/v2"
            - name: EGRESS_GATEWAY_URL
              value: "http://{{ include "codeapi.fullname" . }}-egress-gateway:{{ .Values.egressGateway.service.port }}"
            - name: REDIS_HOST
              value: {{ include "codeapi.redis.host" . }}
            - name: REDIS_PORT
              value: {{ include "codeapi.redis.port" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.fullname" . }}-secrets
                  key: redis-password
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.fullname" . }}-secrets
                  key: codeapi-internal-service-token
            - name: PYTHON_CONCURRENCY
              value: {{ .Values.workerSandbox.config.pythonConcurrency | quote }}
            - name: JOB_TIMEOUT
              value: {{ .Values.workerSandbox.config.jobTimeout | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: dispatch
            timeoutSeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml $officeDispatch.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeapi.fullname" . }}-office-execution-dispatch
spec:
  selector:
    {{- include "codeapi.officeDispatch.selectorLabels" . | nindent 4 }}
  ports:
    - name: dispatch
      port: 3114
      targetPort: dispatch
{{- end }}
