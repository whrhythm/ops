# Certificates for Harbor (issued by the internal CA in apps/cert-manager).
#
# - harbor-tls: nginx TLS termination for https://harbor.k3s.local and the
#   MetalLB IP. The chart also uses this secret as `caSecretName` (core reads
#   ca.crt) and the node script copies ca.crt to /etc/rancher/k3s/harbor-ca.crt.
# - harbor-core-token: RSA key pair for the core token service. Pinned here so
#   the Helm render does not generate a new CA on every ArgoCD sync.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  secretName: harbor-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - harbor.k3s.local
  ipAddresses:
    - 192.168.10.51
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-core-token
  namespace: harbor
spec:
  secretName: harbor-core-token
  commonName: harbor-core-token
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
