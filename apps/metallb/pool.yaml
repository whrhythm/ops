# MetalLB native API (v0.13+): no ConfigMap, no configInline.
# An explicit L2Advertisement is required since v0.13 — pools without one
# are not L2-announced.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default
  namespace: metallb
spec:
  addresses:
    - 192.168.10.50-192.168.10.65
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb
spec:
  ipAddressPools:
    - default
