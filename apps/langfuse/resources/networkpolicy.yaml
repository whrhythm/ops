apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: langfuse-web-from-librechat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat
          podSelector:
            matchLabels: {app: librechat}
      ports:
        - {protocol: TCP, port: 3000}
