apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
spec:
  selector: {app: langfuse-clickhouse}
  ports:
    - {name: http, port: 8123}
    - {name: native, port: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-clickhouse
spec:
  serviceName: langfuse-clickhouse
  replicas: 1
  selector:
    matchLabels: {app: langfuse-clickhouse}
  template:
    metadata:
      labels: {app: langfuse-clickhouse}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.4
          env:
            - {name: CLICKHOUSE_USER, value: langfuse}
            - {name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1"}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: langfuse-runtime, key: clickhouse}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests: {storage: 24Gi}
