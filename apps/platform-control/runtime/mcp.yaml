apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-gateway
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  secretName: mcp-gateway-tls
  dnsNames: [mcp-gateway.platform-system.svc.cluster.local]
  issuerRef: {name: internal-ca, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mcp-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [platform-api, agent-worker]}]
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Only this transport pod, with no platform resource credentials, reaches public HTTPS.
    # It additionally
    # pins the administrator-reviewed URL/IP set and refuses redirects/private DNS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-clients
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  podSelector:
    matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [platform-api, agent-worker]}]
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: mcp-gateway}}}]
      ports: [{protocol: TCP, port: 8443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector: {matchLabels: {app.kubernetes.io/name: mcp-gateway}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: harbor.k3s.local/internal/platform-control@sha256:9d62f3c226107742e737e8285670886acc56431164e031a98a3d4d43d6c157c3
          command: [python, -m, control_plane.mcp_gateway]
          env:
            - name: PLATFORM_MCP_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: platform-mcp-secrets, key: PLATFORM_MCP_GATEWAY_TOKEN}}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 20}
          startupProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 3, failureThreshold: 30}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tls, mountPath: /etc/mcp-tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: mcp-gateway-tls}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  selector: {app.kubernetes.io/name: mcp-gateway}
  ports: [{name: https, port: 8443, targetPort: https}]
