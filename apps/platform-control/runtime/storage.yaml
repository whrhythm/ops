apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-controller
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: storage-controller}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-controller
        codechat.io/publisher: "true"
    spec:
      serviceAccountName: application-controller
      hostAliases: [{ip: 192.168.10.51, hostnames: [harbor.k3s.local]}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: storage
          image: harbor.k3s.local/internal/platform-control@sha256:94e04c4c8772b4e5c10ef14d95957c6f611b573f91cbb48d407bda5f245adb81
          command: [python, -m, control_plane.storage_controller]
          env:
            - {name: PLATFORM_DATABASE_POOL_SIZE, value: "1"}
            - {name: PLATFORM_DATABASE_POOL_OVERFLOW, value: "1"}
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-db-worker}
            - secretRef: {name: platform-workspace-encryption}
            - secretRef: {name: platform-harbor-provisioning}
            - secretRef: {name: platform-object-storage-provisioner}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ca, mountPath: /etc/platform-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          configMap: {name: platform-ca}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
