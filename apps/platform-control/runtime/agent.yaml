apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codechat-agent-jobs
  annotations: {argocd.argoproj.io/sync-wave: "0"}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [workspace-data]
    verbs: [get]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codechat-agent-jobs
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [jobs]
  matchConditions:
    - name: agent-worker-only
      expression: "request.userInfo.username == 'system:serviceaccount:platform-system:agent-worker'"
  variables:
    - name: job
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: pod
      expression: "variables.job.spec.template.spec"
  validations:
    - expression: "request.namespace.matches('^codechat-user-[0-9a-f]{40}$') && variables.job.metadata.name.matches('^agent-[0-9a-f-]{36}$') && variables.job.metadata.labels['codechat.io/agent-command'] == 'true'"
      message: Agent jobs must belong to a recorded personal workspace.
    - expression: "variables.pod.runtimeClassName == 'kata-qemu-runtime-rs' && variables.pod.automountServiceAccountToken == false && variables.pod.restartPolicy == 'Never' && variables.job.spec.backoffLimit == 0 && variables.job.spec.activeDeadlineSeconds <= 1800 && variables.job.spec.ttlSecondsAfterFinished <= 600"
      message: Agent commands require Kata, no service identity, no replay and bounded cleanup.
    - expression: "(!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) && (!has(variables.pod.hostPID) || !variables.pod.hostPID) && (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) && size(variables.pod.containers) == 1"
      message: Agent commands cannot join host namespaces or add auxiliary containers.
    - expression: "size(variables.pod.volumes) <= 2 && variables.pod.volumes[0].name == 'project' && variables.pod.volumes[0].persistentVolumeClaim.claimName == 'workspace-data' && variables.pod.volumes.all(v, v.name == 'project' || (v.name == 'database-ca' && v.secret.secretName.matches('^database-[0-9a-f]{24}$') && size(v.secret.items) == 1 && v.secret.items[0].key == 'ca.crt')) && variables.pod.containers[0].volumeMounts.all(m, (m.name == 'project' && m.mountPath == '/project' && m.subPath.startsWith('files/') && size(m.subPath) > 6 && m.subPath.split('/').all(p, !(p in ['', '.', '..']))) || (m.name == 'database-ca' && m.mountPath == '/etc/codechat-database' && m.readOnly == true))"
      message: Only a project subdirectory may be mounted, never the whole personal disk.
    - expression: "variables.pod.containers.all(c, (!has(c.envFrom) || size(c.envFrom) == 0) && (!has(c.env) || c.env.all(e, !has(e.valueFrom) || (has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.matches('^(database|objects)-[0-9a-f]{24}$') && e.valueFrom.secretKeyRef.key == e.name && e.name in ['DATABASE_URL','PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD','PGSSLMODE','PGSSLROOTCERT','S3_ENDPOINT_URL','S3_BUCKET','AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_DEFAULT_REGION','AWS_REGION']))) && c.securityContext.allowPrivilegeEscalation == false && c.securityContext.readOnlyRootFilesystem == true && c.securityContext.capabilities.drop.exists(x, x == 'ALL'))"
      message: Agent commands cannot import Kubernetes credentials or elevate privileges.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codechat-agent-jobs
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  policyName: codechat-agent-jobs
  validationActions: [Deny]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-worker-egress
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: agent-worker}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 192.168.110.126/32}}]
      ports: [{protocol: TCP, port: 6443}, {protocol: TCP, port: 30443}]
    - to: [{ipBlock: {cidr: 10.43.0.1/32}}]
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: apisix}
      ports: [{protocol: TCP, port: 9443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: agent-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        codechat.io/workspace-client: "true"
    spec:
      serviceAccountName: agent-worker
      hostAliases:
        - ip: 192.168.110.126
          hostnames: [platform.k3s.local]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: harbor.k3s.local/internal/platform-control@sha256:1adab5fc0343e21d7ebff6e391462f9f9644270a6c81cdef3b44276e2331b323
          command: [python, -m, control_plane.agent_worker]
          env:
            - {name: PLATFORM_DATABASE_POOL_SIZE, value: "2"}
            - {name: PLATFORM_DATABASE_POOL_OVERFLOW, value: "2"}
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-db-worker}
            - secretRef: {name: platform-workspace-encryption}
            - secretRef: {name: platform-mcp-secrets}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ca, mountPath: /etc/platform-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          configMap: {name: platform-ca}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
