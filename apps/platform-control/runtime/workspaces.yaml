apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-controller
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codechat-workspace-controller
  annotations: {argocd.argoproj.io/sync-wave: "0"}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, resourcequotas]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: codechat-workspace-controller
  annotations: {argocd.argoproj.io/sync-wave: "0"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: codechat-workspace-controller}
subjects:
  - {kind: ServiceAccount, name: workspace-controller, namespace: platform-system}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: codechat-workspace-boundary
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["", apps, networking.k8s.io, cert-manager.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [namespaces, persistentvolumeclaims, resourcequotas, services, secrets, deployments, networkpolicies, certificates]
  matchConditions:
    - name: workspace-controller-only
      expression: "request.userInfo.username == 'system:serviceaccount:platform-system:workspace-controller'"
  validations:
    - expression: "object.kind == 'Namespace' ? object.metadata.name.matches('^codechat-user-[0-9a-f]{40}$') : request.namespace.matches('^codechat-user-[0-9a-f]{40}$')"
      message: Workspace controller can write only personal workspace namespaces.
    - expression: "object.kind != 'Namespace' || (object.metadata.labels['app.kubernetes.io/managed-by'] == 'platform-control' && object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted')"
      message: Personal namespaces require owner labels and restricted pod security.
    - expression: "object.kind != 'PersistentVolumeClaim' || (object.metadata.name == 'workspace-data' && object.spec.storageClassName == 'codechat-workspace-retain')"
      message: Personal storage must use the retained workspace claim.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: codechat-workspace-boundary
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  policyName: codechat-workspace-boundary
  validationActions: [Deny]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-client-egress
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  podSelector:
    matchLabels: {codechat.io/workspace-client: "true"}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {app.kubernetes.io/managed-by: platform-control}
          podSelector:
            matchLabels: {codechat.io/component: workspace-files}
      ports: [{protocol: TCP, port: 8090}, {protocol: TCP, port: 8091}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-controller-kubernetes
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: workspace-controller}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 192.168.10.30/32}}]
      ports: [{protocol: TCP, port: 6443}]
    - to: [{ipBlock: {cidr: 10.43.0.1/32}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-controller
  namespace: platform-system
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: workspace-controller}
  template:
    metadata:
      annotations:
        codechat.io/config-revision: programming-20261102-3
      labels:
        app.kubernetes.io/name: workspace-controller
        codechat.io/workspace-client: "true"
    spec:
      serviceAccountName: workspace-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: harbor.k3s.local/internal/platform-control@sha256:53d9511b51a4c1c64ded7d41148a8dee9ff33da735a4fab3681dbe1e2b0cde17
          command: [python, -m, control_plane.workspace_controller]
          envFrom:
            - configMapRef: {name: platform-config}
            - secretRef: {name: platform-db-worker}
            - secretRef: {name: platform-workspace-encryption}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ca, mountPath: /etc/platform-ca, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: ca
          configMap: {name: platform-ca}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
