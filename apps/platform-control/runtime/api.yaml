apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      annotations:
        codechat.io/config-revision: releases-20261107-1
      labels:
        app.kubernetes.io/name: platform-api
        codechat.io/workspace-client: "true"
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.10.53
          hostnames:
            - authentik.k3s.local
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.k3s.local/internal/platform-control@sha256:9953e94992e08e15aaffa3522b752c97372778f8cf5a127b3561ba773bd51180
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-db-api
            - secretRef:
                name: platform-model-provisioning
            - secretRef:
                name: platform-mcp-secrets
            - secretRef:
                name: platform-identity-directory
            - secretRef:
                name: platform-knowledge
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/platform-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          configMap:
            name: platform-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8088
      targetPort: http
