apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy: {type: Recreate}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      annotations:
        codechat.io/config-revision: enterprise-e1-20261113-1
      labels:
        app.kubernetes.io/name: platform-api
        codechat.io/workspace-client: "true"
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.10.53
          hostnames:
            - authentik.k3s.local
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.k3s.local/internal/platform-control@sha256:06cb17d458c1151c0ba5a98fe042ecfca4ba7143f5a3892134b918e4da29936b
          env:
            - name: PLATFORM_MODEL_TOOL_FAILURE_GUARD
              value: "true"
            - name: PLATFORM_TOKEN_REFILL_ENABLED
              value: "true"
            - name: PLATFORM_MANAGED_CHAT_BUDGET_ENABLED
              value: "true"
            - name: PLATFORM_MANAGED_CHAT_PROFILES
              value: '{"deepseek-v4-flash-v2":{"native_models":["deepseek-v4-flash-v2","openai/deepseek-v4-flash-v2"],"input_ceiling_per_million":"0.3","output_ceiling_per_million":"1.2","context_limit":1000000,"framing_tokens":1024},"gpt-6-sol":{"native_models":["gpt-6-sol","openai/responses/gpt-6-sol"],"input_ceiling_per_million":"5","output_ceiling_per_million":"15","context_limit":1000000,"framing_tokens":1024,"image_token_bound":32768,"max_image_dimension":2048}}'
            - name: PLATFORM_MANAGED_CHAT_MAX_CALL_USD
              value: "1"
            - name: PLATFORM_MANAGED_CHAT_FREE_DAILY_USD
              value: "1.00"
            - name: PLATFORM_DAILY_FREE_ALL_ACCOUNTS
              value: "true"
            - name: PLATFORM_SIMULATOR_ORDERS_MONTHLY
              value: "1"
            - name: PLATFORM_XUNHUPAY_SIMULATOR_ENABLED
              value: "true"
            - name: PLATFORM_XUNHUPAY_SIMULATOR_ACCOUNT
              value: ""
            - name: PLATFORM_XUNHUPAY_APPID
              valueFrom: {secretKeyRef: {name: payment-simulation, key: appid}}
            - name: PLATFORM_XUNHUPAY_SECRET
              valueFrom: {secretKeyRef: {name: payment-simulation, key: secret}}
            - name: PLATFORM_DAILY_FREE_ACCOUNT
              value: "6ee749cd-614b-411e-8a3c-aa92b19b79e5"
            - name: PLATFORM_DAILY_FREE_STARTS_AT
              value: "2026-11-24T00:00:00+08:00"
            - name: PLATFORM_DAILY_FREE_ENDS_AT
              value: "2026-11-24T14:40:00+08:00"
            - name: PLATFORM_DAILY_FREE_TOKENS
              value: "1000000"
            - name: PLATFORM_DAILY_FREE_MAX_OUTPUT
              value: "4096"
            - name: PLATFORM_DAILY_FREE_MODELS
              value: '["deepseek-v4-flash-v2"]'
            - name: PLATFORM_DAILY_FREE_SPONSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: first-release-daily-funding
                  key: token
            - name: PLATFORM_DAILY_FREE_SPONSOR_OWNER
              value: "starbridge-first-release-daily-20261124"
            - name: PLATFORM_OFFICE_SKILLS_ENABLED
              value: "true"
            - name: PLATFORM_COST_CONSOLE_TEST_MODE
              value: "true"
            - name: PLATFORM_COST_CONSOLE_ENABLED
              value: "true"
            - name: PLATFORM_OPENMETER_URL
              value: http://openmeter.platform-system.svc.cluster.local:8888
            - name: PLATFORM_OFFICE_TASKS_ENABLED
              value: "true"
            - name: PLATFORM_ENTERPRISE_ENABLED
              value: "true"
            - name: PLATFORM_ENTERPRISE_COLLABORATION_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-db-api
            - secretRef:
                name: platform-model-provisioning
            - secretRef:
                name: platform-mcp-secrets
            - secretRef:
                name: platform-identity-directory
            - secretRef:
                name: platform-knowledge
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/platform-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: payment-simulator
          image: harbor.k3s.local/internal/platform-control@sha256:5d2711fdbd594c7e548d539b7c58ee658d2edf07c514c248b5b48647a275ed1c
          command: [python, /app/scripts/xunhupay_simulator.py, --auto-pay, --state, /var/lib/payment-simulator/orders.sqlite]
          env:
            - name: XUNHUPAY_SIM_APPID
              valueFrom: {secretKeyRef: {name: payment-simulation, key: appid}}
            - name: XUNHUPAY_SIM_SECRET
              valueFrom: {secretKeyRef: {name: payment-simulation, key: secret}}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: payment-state, mountPath: /var/lib/payment-simulator}
      volumes:
        - name: payment-state
          persistentVolumeClaim: {claimName: payment-simulation}
        - name: ca
          configMap:
            name: platform-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-simulation
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8088
      targetPort: http
