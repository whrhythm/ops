apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      annotations:
        codechat.io/config-revision: enterprise-e1-20261113-1
      labels:
        app.kubernetes.io/name: platform-api
        codechat.io/workspace-client: "true"
    spec:
      automountServiceAccountToken: false
      hostAliases:
        - ip: 192.168.10.53
          hostnames:
            - authentik.k3s.local
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.k3s.local/internal/platform-control@sha256:8c3467fa172d2204877c4d856f70300c1049c79705c805d4538d763f4b78dc74
          env:
            - name: PLATFORM_DAILY_FREE_ACCOUNT
              value: "6ee749cd-614b-411e-8a3c-aa92b19b79e5"
            - name: PLATFORM_DAILY_FREE_STARTS_AT
              value: "2026-11-24T00:00:00+08:00"
            - name: PLATFORM_DAILY_FREE_ENDS_AT
              value: "2026-11-24T14:40:00+08:00"
            - name: PLATFORM_DAILY_FREE_TOKENS
              value: "4096"
            - name: PLATFORM_DAILY_FREE_MAX_OUTPUT
              value: "768"
            - name: PLATFORM_DAILY_FREE_MODELS
              value: '["deepseek-v4-flash-v2"]'
            - name: PLATFORM_DAILY_FREE_SPONSOR_KEY
              valueFrom:
                secretKeyRef:
                  name: r3-daily-trial-key
                  key: token
            - name: PLATFORM_DAILY_FREE_SPONSOR_OWNER
              value: "starbridge-r3-daily-demo-20261123"
            - name: PLATFORM_OFFICE_SKILLS_ENABLED
              value: "true"
            - name: PLATFORM_COST_CONSOLE_ENABLED
              value: "true"
            - name: PLATFORM_OPENMETER_URL
              value: http://openmeter.platform-system.svc.cluster.local:8888
            - name: PLATFORM_OFFICE_TASKS_ENABLED
              value: "true"
            - name: PLATFORM_ENTERPRISE_ENABLED
              value: "true"
            - name: PLATFORM_ENTERPRISE_COLLABORATION_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-db-api
            - secretRef:
                name: platform-model-provisioning
            - secretRef:
                name: platform-mcp-secrets
            - secretRef:
                name: platform-identity-directory
            - secretRef:
                name: platform-knowledge
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/platform-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          configMap:
            name: platform-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8088
      targetPort: http
