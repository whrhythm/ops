apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrate
  namespace: platform-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: harbor.k3s.local/internal/platform-control@sha256:7a65b9a90a959df82464061d883f46ae932bf9921f88ecfe7c02f28220f14a0d
          command: [/bin/sh, -ec]
          args:
            - |
              alembic upgrade head
              python /deploy/grants.py
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-db-migrator
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/platform-ca
              readOnly: true
            - name: migration
              mountPath: /deploy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          configMap:
            name: platform-ca
        - name: migration
          configMap:
            name: platform-migration
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-migration
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  grants.py: |
    from sqlalchemy import create_engine, text
    import os
    engine = create_engine(os.environ["PLATFORM_DATABASE_URL"])
    with engine.begin() as db:
        db.execute(text("REVOKE CREATE ON SCHEMA public FROM PUBLIC"))
        db.execute(text("GRANT USAGE ON SCHEMA public TO platform_api, platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON tenants, memberships, projects, resources, operations, test_orders TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE, DELETE ON user_environments TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON workspace_projects TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON ai_project_bindings TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON ai_project_drafts, ai_project_trials, ai_trial_sessions, ai_trial_runs TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON ai_applications, ai_releases, ai_app_members, ai_app_entries, ai_app_runs, ai_app_calls TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON project_knowledge, knowledge_libraries TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON project_knowledge, knowledge_libraries, ai_project_bindings TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON business_templates, payment_receipts TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON workspace_provisioning_intents TO platform_api"))
        db.execute(text("GRANT SELECT ON workspace_volume_bindings, workspace_file_services TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON user_environments TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON workspace_provisioning_intents, workspace_file_services TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT ON workspace_volume_bindings TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON user_applications TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON user_applications TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON user_registries TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON model_credentials TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON agent_preferences, agent_tasks TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON project_versions, project_restores TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON agent_tasks TO platform_worker"))
        db.execute(text("GRANT SELECT ON agent_preferences TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON mcp_servers, mcp_credentials TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON account_access TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON code_executions TO platform_api"))
        db.execute(text("GRANT SELECT ON account_access TO platform_worker"))
        db.execute(text("GRANT SELECT ON mcp_servers, mcp_credentials TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON capacity_accounts, capacity_orders, storage_measurements TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON capacity_accounts, capacity_orders TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON project_databases TO platform_api"))
        db.execute(text("GRANT SELECT, UPDATE ON project_databases TO platform_worker"))
        db.execute(text("GRANT SELECT ON user_object_storage TO platform_api"))
        db.execute(text("GRANT UPDATE (status, error_code) ON user_object_storage TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON user_object_storage, storage_measurements TO platform_worker"))
        db.execute(text("GRANT SELECT ON user_registries TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON ai_configuration TO platform_api, platform_worker"))
        db.execute(text("GRANT SELECT ON model_wallets, model_credits TO platform_api"))
        db.execute(text("GRANT SELECT, INSERT, UPDATE ON model_wallets, model_credits TO platform_worker"))
        db.execute(text("GRANT SELECT ON model_credentials TO platform_worker"))
        db.execute(text("GRANT SELECT, INSERT ON audit_events TO platform_api"))
        db.execute(text("GRANT SELECT ON alembic_version TO platform_api, platform_worker"))
        db.execute(text("GRANT SELECT ON tenants, resources, operations TO platform_worker"))
        db.execute(text("GRANT UPDATE (id) ON tenants TO platform_worker"))
        db.execute(text("GRANT UPDATE (status) ON resources TO platform_worker"))
        db.execute(text("GRANT UPDATE (status, plan) ON operations TO platform_worker"))
        db.execute(text("GRANT INSERT ON audit_events TO platform_worker"))
    print("Platform schema migrated; runtime database permissions granted")
