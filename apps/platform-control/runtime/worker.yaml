apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: harbor.k3s.local/internal/platform-control@sha256:87427db6a191035f375a9306c31663b5f2567ed1648aa6841056f70b5d3c936d
          command: [python, -m, control_plane.worker]
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-db-worker
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from control_plane.database import engine; c=engine.connect(); c.exec_driver_sql('SELECT 1'); c.close(); engine.dispose()"
            initialDelaySeconds: 3
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/platform-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          configMap:
            name: platform-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
