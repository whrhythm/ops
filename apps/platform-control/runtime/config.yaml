apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  PLATFORM_PUBLIC_ORIGIN: https://platform.k3s.local:30443
  PLATFORM_ADDITIONAL_PUBLIC_ORIGIN: https://chat.k3s.local:30443
  PLATFORM_OIDC_ISSUER: https://authentik.k3s.local:30443/application/o/platform/
  # JWKS contents are independent of the public port. Resolve this hostname to
  # the internal LB address via hostAliases and validate its real certificate.
  PLATFORM_OIDC_JWKS_URL: https://authentik.k3s.local/application/o/platform/jwks/
  PLATFORM_OIDC_AUDIENCE: platform-console
  PLATFORM_OIDC_CLIENT_ID: platform-console
  PLATFORM_OIDC_REQUIRED_SCOPE: platform-api
  PLATFORM_ADMIN_GROUP: platform-admins
  PLATFORM_WORKSPACE_FILES_ENABLED: "true"
  PLATFORM_PUBLISHER_ENABLED: "true"
  PLATFORM_BUILDKIT_IMAGE: harbor.k3s.local/internal/codechat-buildkit@sha256:19df7a246d5d9b3d30726c4ed5c660701d577639dea2596a6c02cf75b6d5455f
  PLATFORM_WORKSPACE_PYTHON_BASE_IMAGE: harbor.k3s.local/codechat-base/python@sha256:914752997e0f5fb7c78351fefefb378b7d1a2c3cad7d88ebe4b195dd5751f5ff
  PLATFORM_APPLICATION_ORIGIN: http://192.168.10.30.sslip.io:30097
  PLATFORM_DEFAULT_APPLICATION_LIMIT: "3"
  PLATFORM_WORKSPACE_AGENT_IMAGE: harbor.k3s.local/internal/platform-control@sha256:34c9ae4a7db0b2818642becc89590a457160bda90d4cafeb9403a97b9279944b
  PLATFORM_WORKSPACE_AGENT_MAX_ITERATIONS: "40"
  PLATFORM_WORKSPACE_AGENT_MAX_SECONDS: "180"
  PLATFORM_WORKSPACE_SERVICE_IMAGE: harbor.k3s.local/internal/platform-control@sha256:63363da2c64d00d646293cdf6daedf91f175641a29b34da0c819ec327cf44272
  PLATFORM_LITELLM_URL: http://litellm.litellm.svc.cluster.local:4000
  PLATFORM_LITELLM_MODELS: deepseek-v4-flash-v2
  SSL_CERT_FILE: /etc/platform-ca/internal-ca.crt
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
