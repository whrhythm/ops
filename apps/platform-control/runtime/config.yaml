apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  PLATFORM_KNOWLEDGE_ENABLED: "true"
  PLATFORM_KNOWLEDGE_URL: http://knowledge-api.knowledge.svc.cluster.local:8000
  PLATFORM_AI_PROJECTS_ENABLED: "true"
  PLATFORM_PROJECT_VERSIONS_ENABLED: "true"
  PLATFORM_PROJECT_VERSIONS_LIMIT: "20"
  PLATFORM_CODE_EXECUTION_ENABLED: "true"
  PLATFORM_CODE_EXECUTION_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEAr7TXAsJ6Z0QhQoqZ2/UedZ5HEh0k7Ws0H1dqV9dZrSo=
    -----END PUBLIC KEY-----
  PLATFORM_PUBLIC_ORIGIN: https://platform.k3s.local:30443
  PLATFORM_ADDITIONAL_PUBLIC_ORIGIN: https://chat.k3s.local:30443
  PLATFORM_OIDC_ISSUER: https://authentik.k3s.local:30443/application/o/platform/
  # JWKS contents are independent of the public port. Resolve this hostname to
  # the internal LB address via hostAliases and validate its real certificate.
  PLATFORM_OIDC_JWKS_URL: https://authentik.k3s.local/application/o/platform/jwks/
  PLATFORM_OIDC_AUDIENCE: platform-console
  PLATFORM_OIDC_CLIENT_ID: platform-console
  PLATFORM_OIDC_REQUIRED_SCOPE: platform-api
  PLATFORM_ADMIN_GROUP: platform-admins
  PLATFORM_WORKSPACE_FILES_ENABLED: "true"
  PLATFORM_PUBLISHER_ENABLED: "true"
  PLATFORM_BUILDKIT_IMAGE: harbor.k3s.local/internal/codechat-buildkit@sha256:19df7a246d5d9b3d30726c4ed5c660701d577639dea2596a6c02cf75b6d5455f
  PLATFORM_WORKSPACE_PYTHON_BASE_IMAGE: harbor.k3s.local/codechat-base/python@sha256:914752997e0f5fb7c78351fefefb378b7d1a2c3cad7d88ebe4b195dd5751f5ff
  PLATFORM_APPLICATION_ORIGIN: http://192.168.10.30.sslip.io:30097
  PLATFORM_DEFAULT_APPLICATION_LIMIT: "3"
  PLATFORM_BUILD_JOB_RETENTION_SECONDS: "300"
  PLATFORM_PROJECT_DATABASES_ENABLED: "true"
  PLATFORM_BUSINESS_TEMPLATES_ENABLED: "true"
  PLATFORM_PROJECT_DATABASE_BUDGET_MIB: "256"
  PLATFORM_PROJECT_DATABASE_RESERVATION_MIB: "128"
  PLATFORM_PROJECT_DATABASE_LIMIT: "2"
  PLATFORM_STORAGE_METERING_ENABLED: "true"
  PLATFORM_OBJECT_STORAGE_ENABLED: "true"
  PLATFORM_OBJECT_STORAGE_ENDPOINT: minio.minio.svc.cluster.local:9000
  PLATFORM_OBJECT_STORAGE_SECURE: "false"
  PLATFORM_OBJECT_STORAGE_BUDGET_MIB: "256"
  PLATFORM_OBJECT_STORAGE_SCAN_LIMIT: "10000"
  PLATFORM_STORAGE_SAMPLE_MAX_AGE_SECONDS: "180"
  PLATFORM_WORKSPACE_PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
  PLATFORM_BUILD_SCRATCH_MIB: "2048"
  PLATFORM_BUILD_MEMORY_MIB: "3072"
  PLATFORM_WORKSPACE_AGENT_IMAGE: harbor.k3s.local/internal/platform-control@sha256:ec1dd81fcff755e11cda8dd6d0189803c830beede1b6c1e5e55341865eb1557b
  PLATFORM_WORKSPACE_AGENT_MAX_ITERATIONS: "40"
  PLATFORM_WORKSPACE_AGENT_MAX_SECONDS: "180"
  PLATFORM_AGENT_TASKS_ENABLED: "true"
  PLATFORM_AGENT_COMMAND_IMAGE: harbor.k3s.local/internal/platform-control@sha256:ec1dd81fcff755e11cda8dd6d0189803c830beede1b6c1e5e55341865eb1557b
  PLATFORM_AGENT_PLATFORM_URL: https://platform.k3s.local:30443
  PLATFORM_MCP_GATEWAY_URL: https://mcp-gateway.platform-system.svc.cluster.local:8443
  PLATFORM_AGENT_CONCURRENCY: "2"
  PLATFORM_AGENT_TASK_SECONDS: "1800"
  PLATFORM_AGENT_COMMAND_SECONDS: "180"
  PLATFORM_AGENT_APPROVAL_SECONDS: "900"
  PLATFORM_WORKSPACE_SERVICE_IMAGE: harbor.k3s.local/internal/platform-control@sha256:03879682c7944359e5438327e867a0662813d709e966b88fc19df09497d9cecd
  PLATFORM_LITELLM_URL: http://litellm.litellm.svc.cluster.local:4000
  PLATFORM_LITELLM_MODELS: deepseek-v4-flash-v2
  PLATFORM_CAPABILITIES_ENABLED: "true"
  PLATFORM_CAPABILITY_CHAT_ROUTE: codechat-chat
  PLATFORM_CAPABILITY_CODING_ROUTE: codechat-coding
  PLATFORM_CAPABILITY_CHAT_MODEL: deepseek-v4-flash-v2
  # Initial test settlement rule, not a live FX quotation. Editable in admin UI.
  PLATFORM_MODEL_SETTLEMENT_CNY_PER_USD: "7.000000"
  # Test entitlement orders only. No real payment provider or recurring billing.
  PLATFORM_TEST_PAYMENTS_ENABLED: "true"
  PLATFORM_CAPACITY_UPGRADES_ENABLED: "true"
  PLATFORM_CAPACITY_RESIZE_TIMEOUT_SECONDS: "900"
  PLATFORM_CAPACITY_FILESYSTEM_OVERHEAD_PERCENT: "10"
  PLATFORM_CAPACITY_PLANS_JSON: >-
    [{"id":"basic","version":"test-v2","name":"基础版","description":"适合日常聊天、学习与轻量编程项目","storage_gib":4,"application_limit":5,"amount_minor":1000,"model_credit_cny_minor":1000,"currency":"CNY","features":["上传、预览和编辑项目文件","编程助手执行测试与镜像发布","查看应用日志和运行状态"]},{"id":"pro","version":"test-v2","name":"专业版","description":"适合持续开发与多个应用项目","storage_gib":8,"application_limit":10,"amount_minor":2000,"model_credit_cny_minor":2000,"currency":"CNY","features":["包含基础版全部功能","更大的个人项目与依赖空间","更多发布应用名额"]}]
  SSL_CERT_FILE: /etc/platform-ca/internal-ca.crt
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
