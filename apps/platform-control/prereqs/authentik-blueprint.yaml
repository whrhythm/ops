# Public browser client only. No password, client secret or signing key material.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-authentik-blueprint
  namespace: authentik
data:
  platform.yaml: |
    version: 1
    metadata:
      name: Platform control plane OIDC
    entries:
      # Internal trial registration: email is collected but is not verified.
      # All names are CodeChat-specific; do not overwrite authentik's sample flow.
      - model: authentik_flows.flow
        id: codechat-enrollment
        identifiers:
          slug: codechat-enrollment
        attrs:
          name: CodeChat internal enrollment
          title: CodeChat 内网试用注册（邮箱尚未验证）
          designation: enrollment
          authentication: require_unauthenticated
      - model: authentik_stages_prompt.prompt
        id: codechat-username
        identifiers: {name: codechat-enrollment-username}
        attrs: {field_key: username, label: 用户名, type: username, required: true, placeholder: 用户名, placeholder_expression: false, order: 0}
      - model: authentik_stages_prompt.prompt
        id: codechat-password
        identifiers: {name: codechat-enrollment-password}
        attrs: {field_key: password, label: 密码, type: password, required: true, placeholder: 密码, placeholder_expression: false, order: 1}
      - model: authentik_stages_prompt.prompt
        id: codechat-password-repeat
        identifiers: {name: codechat-enrollment-password-repeat}
        attrs: {field_key: password_repeat, label: 再次输入密码, type: password, required: true, placeholder: 再次输入密码, placeholder_expression: false, order: 2}
      - model: authentik_stages_prompt.prompt
        id: codechat-name
        identifiers: {name: codechat-enrollment-name}
        attrs: {field_key: name, label: 显示名称, type: text, required: true, placeholder: 显示名称, placeholder_expression: false, order: 0}
      - model: authentik_stages_prompt.prompt
        id: codechat-email
        identifiers: {name: codechat-enrollment-email}
        attrs: {field_key: email, label: 邮箱（未验证）, type: email, required: true, placeholder: 邮箱, placeholder_expression: false, order: 1}
      - model: authentik_stages_prompt.promptstage
        id: codechat-account-prompt
        identifiers: {name: codechat-enrollment-account}
        attrs:
          fields: [!KeyOf codechat-username, !KeyOf codechat-password, !KeyOf codechat-password-repeat]
      - model: authentik_stages_prompt.promptstage
        id: codechat-profile-prompt
        identifiers: {name: codechat-enrollment-profile}
        attrs:
          fields: [!KeyOf codechat-name, !KeyOf codechat-email]
      - model: authentik_stages_user_write.userwritestage
        id: codechat-user-write
        identifiers: {name: codechat-enrollment-write}
        attrs: {user_creation_mode: always_create}
      - model: authentik_stages_user_login.userloginstage
        id: codechat-user-login
        identifiers: {name: codechat-enrollment-login}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf codechat-enrollment, stage: !KeyOf codechat-account-prompt, order: 10}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf codechat-enrollment, stage: !KeyOf codechat-profile-prompt, order: 11}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf codechat-enrollment, stage: !KeyOf codechat-user-write, order: 20}
      - model: authentik_flows.flowstagebinding
        identifiers: {target: !KeyOf codechat-enrollment, stage: !KeyOf codechat-user-login, order: 100}
      # Preserve existing user fields; serializer requires these when updating.
      - model: authentik_stages_identification.identificationstage
        identifiers: {name: default-authentication-identification}
        attrs:
          user_fields: [email, username]
          enrollment_flow: !KeyOf codechat-enrollment
      - model: authentik_core.group
        identifiers:
          name: platform-admins
        attrs:
          is_superuser: false
      - model: authentik_providers_oauth2.scopemapping
        id: platform-scope
        identifiers:
          name: Platform API access
        attrs:
          scope_name: platform-api
          description: Access your projects and resource requests
          expression: return {}
      - model: authentik_providers_oauth2.oauth2provider
        id: platform-provider
        identifiers:
          name: Platform console
        attrs:
          client_id: platform-console
          client_type: public
          grant_types:
            - authorization_code
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          access_code_validity: minutes=1
          access_token_validity: minutes=15
          include_claims_in_id_token: true
          redirect_uris:
            - matching_mode: strict
              url: https://platform.k3s.local:30443/
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://chat.k3s.local:30443/oauth/openid/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://chat.k3s.local:30443/codechat
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://platform.k3s.local:30443/
              redirect_uri_type: logout
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf platform-scope
      - model: authentik_core.application
        identifiers:
          slug: platform
        attrs:
          name: 开发空间
          provider: !KeyOf platform-provider
          meta_launch_url: https://platform.k3s.local:30443/
